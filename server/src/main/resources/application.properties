spring.main.banner-mode=off
server.address=${APRSJS_BIND_ADDRESS:0.0.0.0}
server.port=${APRSJS_HTTP_PORT:8180}
server.shutdown=graceful
aprs.api.address=${APRSJS_API_BIND_ADDRESS:0.0.0.0}
aprs.api.port=${APRSJS_API_HTTP_PORT:8181}
aprs.station=${APRSJS_STATION:NOCALL}
aprs.config-file=${APRSJS_CONFIG_FILE:data/connections.json}
spring.codec.max-in-memory-size=64KB
application-version.application-name=APRS JSON Server
application-version.version=1.0.0
